<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Web Component Lifecycle</title>
	<style>
		:root {
			--primary-color: #007bff;
			--text-color: #333;
		}
		hello-component {
			display: block;
			font-family: sans-serif;
			color: var(--text-color);
			border: 1px solid var(--primary-color);
			padding: 1rem;
			border-radius: 0.5rem;
			text-align: center;
		}
	</style>
</head>
<body>
<hello-component message="Hello, World!"></hello-component>
<button id="remove">Remove Component</button>
<button id="update">Update Message</button>

<script type="module">
	class HelloComponent extends HTMLElement {
		static get observedAttributes() {
			return ['message'];
		}

		/*
		  I just did things in the constructor, I probably shouldn't but why can I get away with it?  Do you see how the downside of LLM code gen is that it is making assumptions, one assumption also often implies another step or locks you into a pattern that you may not understand the long term consequences of.but...then I'll tell a story about an architectural decision we made in support of logic and developer interest and awareness of CSS forced us to abandon it even though technically the choice was correct.  TL;DR - most all decisions are it depends...you just have no WHY it depends.

		 */
		constructor() {
			super();
			this.attachShadow({ mode: 'open' });
			this.shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: block;
                            font-family: sans-serif;
                            color: var(--text-color);
                            border: 1px solid var(--primary-color);
                            padding: 1rem;
                            border-radius: 0.5rem;
                            text-align: center;
                        }
                    </style>
                    <h2 id="title"></h2>
                    <p>Rendered at ${new Date()}</p>
                `;
			this.titleElement = this.shadowRoot.getElementById('title');
		}

		connectedCallback() {
			console.log('Component added to the DOM');
			this.render();
		}

		disconnectedCallback() {
			console.log('Component removed from the DOM');
		}

		attributeChangedCallback(name, oldValue, newValue) {
			console.log(`Attribute '${name}' changed from '${oldValue}' to '${newValue}'`);
			this.render();
		}

		// what's this one!?!
		adoptedCallback() {
			console.log('Component moved to a new document');
		}

		render() {
			this.titleElement.textContent = this.getAttribute('message') || 'Default Message';
		}
	}

	customElements.define('hello-component', HelloComponent);

	document.getElementById('remove').addEventListener('click', () => {
		const component = document.querySelector('hello-component');
		if (component) {
			component.remove();
		}
	});

	document.getElementById('update').addEventListener('click', () => {
		const component = document.querySelector('hello-component');
		if (component) {
			const newMessage = `Updated at ${new Date().toLocaleTimeString()}`;
			component.setAttribute('message', newMessage);
		}
	});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="/styles/main.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me | Connor H. Huang</title>
    <style>
        #theform {
            width: 95%;
            margin: auto;
        }
        fieldset {
            width: 100%;
            margin: auto;
        }
        #infofield {
            display:flex;
            flex-direction: column;
            flex-wrap: wrap;
        }
        #infofield * {
            width: 80%;
            max-width: 400px;
            margin: 0em 0.25em 0.25em;
        }
        #messagefield{
            display:flex;
            flex-direction: column;
        }
        #messagefield * {
            margin: 0em 0.25em 0.25em;
        }
        input:valid + span::after {
            content: "✔";
            color: green;
            font-weight: bold;
        }
        input:invalid + span::after {
            content: "✕";
            color: red;
            font-weight: bold;
        }
        input:placeholder-shown + span::after {
            content: "";
        }
        .required::after {
            content: "*";
            color: red;
        }

        .errormsg{
            display: None;
            margin: auto;
        }

        .infomsg{
            display: None;
            margin: auto;
        }

        button {
            margin: 1em auto auto 0.25em;
        }
    </style>
</head>

    <main>
        <section>
            <h1>Contact me</h1>
            <p>Please fill out the contact form with your name, email, reason to contact, and message body.</p>
        </section>
        <section id="theform"> 
            <form class="contact_form" action="https://httpbin.org/post" method="POST" autofocus>
                <fieldset id="infofield">
                    <legend>Your Information</legend>
                    <label for="fullname" class="required">Full Name: </label>
                    <div>
                        <input type="text" id="fullname" name="fullname" placeholder="name" required>
                        <span></span>
                    </div>
                    <label for="email" class="required">Email: </label>
                    <div>
                        <input type="email" id="email" name="email" placeholder="email" required>
                        <span></span>
                    </div>
                </fieldset>
                <fieldset id="messagefield">
                    <legend>Message</legend>
                    <label for="reason">Contact Reason</label>
                    <input type="text" id="reason" name="reason" maxlength="30" list="reasons" placeholder="Type or choose from menu">
                    <datalist id="reasons">
                        <option value="Employment">Employment</option>
                        <option value="Collaboration">Collaboration</option>
                        <option value="Project Inquiry">Project Inquiry</option>
                    </datalist>
                    <label for="message" class="required">Message</label>
                    <textarea id="message" name="message" maxlength="1000" required></textarea>
                </fieldset>
                <button type="submit">Submit</button>
                <output class="errormsg">Filler Text</output>
                <output class="infomsg">Filler Text AGAIN</output>
            </form>
        </section>
    </main>

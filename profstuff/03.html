<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Web Component Demo</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body {
			height: 100%;
			margin: 2rem;
			display: grid;
			place-items: center;
		}

		main {
			text-align: center;
			padding: 2rem;
			border: 1px solid #ccc;
			border-radius: 8px;
			box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
		}
	</style>
</head>
<body>

<main>
	<h1>Web Component Demo</h1>

	<!-- You can have multiple instances - make some copies! -->
	<example-comp></example-comp>


	<!-- Example of listening to the custom event -->
	<output id="event-output">&nbsp;</output>

</main>

<script type="module">
	// Define the ExampleComp web component
	class ExampleComp extends HTMLElement {
		constructor() {
			super();

			// Create a shadow root
			this.attachShadow({ mode: 'open' });

			// Initialize the counter state
			this._count = 0;


		}

		connectedCallback() {
			// Create the component's HTML structure
			this.shadowRoot.innerHTML = `
            <style>
                :host {
                    display: block;
                    padding: 1rem;
                }

                .counter {
                    display: flex;
                    gap: 1rem;
                    align-items: center;
                }

                .count {
                    font-size: 1.2rem;
                    min-width: 3rem;
                }
            </style>

            <div class="counter">
                <output class="count">${this._count}</output>
                <button>Add</button>
            </div>
        `;

			// Bind the click handler
			this.shadowRoot.querySelector('button')
				.addEventListener('click', () => this.increment());
		}

		// Getter for the count property
		get count() {
			return this._count;
		}

		// Setter for the count property
		set count(value) {
			this._count = value;
			// Update the display when count changes
			this.updateDisplay();
		}

		// Method to increment the counter
		increment() {
			this.count++;

			// Dispatch a custom event when count changes
			this.dispatchEvent(new CustomEvent('countChange', {
				detail: { count: this.count },
				bubbles: true,
				composed: true
			}));
		}

		// Update the display
		updateDisplay() {
			this.shadowRoot.querySelector('.count').textContent = this._count;
		}
	}

	// Register the custom element
	customElements.define('example-comp', ExampleComp);

</script>
<script>
	window.addEventListener('DOMContentLoaded', () => {
		// Example of listening to the custom event
		document.addEventListener('countChange', (e) => {
			document.getElementById('event-output').textContent =
				`Counter changed to: ${e.detail.count}`;
		});
	});

</script>

</body>
</html>
